# investMITRA — Prefect Deployment Configuration
# Managed pool pulls code from GitHub on every run

name: investmitra
prefect-version: 3.8.1

build: null

push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/MITRASeries-LABS/investMITRA.git
      branch: main
      id: clone-step
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: "{{ clone-step.directory }}/requirements-flow.txt"
      stream_output: true

deployments:
  - name: nse-bhavcopy-daily
    version: null
    tags: [market_data, daily]
    description: "Daily NSE Bhavcopy EOD equity price ingestion"
    entrypoint: src/connectors/flows/ingest_nse_bhavcopy.py:ingest_nse_bhavcopy
    schedule:
      cron: "30 14 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}

  - name: bse-eod-daily
    description: "Daily BSE EOD equity price ingestion"
    entrypoint: src/connectors/flows/ingest_bse_eod.py:ingest_bse_eod
    schedule:
      cron: "0 15 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}

  - name: nse-delivery-daily
    description: "Daily NSE delivery % and VWAP ingestion"
    entrypoint: src/connectors/flows/ingest_nse_delivery.py:ingest_nse_delivery
    schedule:
      cron: "45 14 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}

  - name: nse-fo-bhavcopy-daily
    description: "Daily NSE F&O OHLCV + open interest ingestion"
    entrypoint: src/connectors/flows/ingest_nse_fo_bhavcopy.py:ingest_nse_fo_bhavcopy
    schedule:
      cron: "15 15 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}
  
  - name: nse-circuit-limits-daily
    description: "Daily NSE circuit limits ingestion"
    entrypoint: src/connectors/flows/ingest_nse_circuit_limits.py:ingest_nse_circuit_limits
    schedule:
      cron: "30 14 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}

  - name: cross-validate-daily
    description: "Daily NSE vs BSE price cross-validation"
    entrypoint: src/connectors/flows/cross_validate_nse_bse.py:cross_validate_nse_bse
    schedule:
      cron: "30 15 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}

  - name: ca-adjustment-daily
    description: "Daily corporate action price adjustment"
    entrypoint: src/connectors/flows/ca_adjustment.py:ca_adjustment_daily
    schedule:
      cron: "0 16 * * 1-5"
      timezone: "UTC"
    work_pool:
      name: cc-worker-pool
    parameters: {}