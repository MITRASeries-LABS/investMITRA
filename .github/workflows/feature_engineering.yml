name: Feature Engineering — Daily Price Features

on:
  workflow_call:
    inputs:
      automatic:
        type: boolean
        default: false
      date:
        type: string
        required: true
      start:
        type: string
        default: ''
      end:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      date:
        description: "Date to compute features for (YYYY-MM-DD)"
        required: false
        default: ""
      start:
        description: "Start date for range computation (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "End date for range computation (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: feature_engineering-production
  cancel-in-progress: false

jobs:
  compute-features:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Refuse late automatic rebuild
        if: inputs.automatic
        run: python scripts/pipeline_readiness.py --check-cutoff

      - name: Resolve trade date once
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          trade_date=$(python scripts/pipeline_date.py --date "$INPUT_DATE" --start "$INPUT_START" --end "$INPUT_END")
          echo "TRADE_DATE=$trade_date" >> "$GITHUB_ENV"
          echo "RANGE_START=$INPUT_START" >> "$GITHUB_ENV"
          echo "Resolved trade date: $trade_date"

      - name: Install dependencies
        run: pip install -r requirements-flow.txt duckdb pyarrow boto3 numpy yfinance psycopg2-binary beautifulsoup4 requests

      - name: Validate dated prices input
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/verify_pipeline_data.py --date "$TRADE_DATE" --stage prices

      - name: Compute price features
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "$RANGE_START" ]; then
            python scripts/compute_features.py --start "$RANGE_START" --end "$TRADE_DATE"
          else
            python scripts/compute_features.py --date "$TRADE_DATE"
          fi

      - name: Validate dated features input
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/verify_pipeline_data.py --date "$TRADE_DATE" --stage features

      - name: Compute momentum scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "$RANGE_START" ]; then
            python scripts/compute_momentum_score.py --start "$RANGE_START" --end "$TRADE_DATE"
          else
            python scripts/compute_momentum_score.py --date "$TRADE_DATE"
          fi

      - name: Validate dated momentum input
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/verify_pipeline_data.py --date "$TRADE_DATE" --stage momentum

      - name: Compute financial stress scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/compute_financial_stress_score.py --date "$TRADE_DATE"

      - name: Compute management quality scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/compute_management_quality_score.py --date "$TRADE_DATE"

      - name: Compute composite investMITRA score
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/compute_investmitra_score.py --date "$TRADE_DATE"

      - name: Load scores to Neon
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/load_scores_to_neon.py --date "$TRADE_DATE"

      - name: Compute early signals
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: python scripts/compute_early_signals.py --date "$TRADE_DATE"

      - name: Fetch Screener signals
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_screener_signals.py

      - name: Fetch corporate events
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_corporate_events.py

      - name: Fetch NSE announcements
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_nse_announcements.py

      - name: Fetch SEBI RSS
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_sebi_rss.py

      - name: Fetch F&O stock list
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_fo_stocks.py

      - name: Fetch market indices
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_market_indices.py

      - name: Fetch global sentiment
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_global_sentiment.py

      - name: Compute daily top picks
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          python scripts/daily_top_picks.py --date "$TRADE_DATE" --top 10 --cap ALL --no-ta
          python scripts/daily_top_picks.py --date "$TRADE_DATE" --top 10 --cap SMALLMICRO --no-ta

      - name: Daily trade analysis (Sonnet)
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/trade_analyzer.py
