name: Feature Engineering — Daily Price Features

on:
  schedule:
    # Run at 10:30 PM IST (17:00 UTC) Mon-Fri — after market data is loaded to Neon
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to compute features for (YYYY-MM-DD)"
        required: false
        default: ""
      start:
        description: "Start date for range computation (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "End date for range computation (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  compute-features:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-flow.txt duckdb pyarrow boto3 numpy yfinance psycopg2-binary

      - name: Compute price features
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python scripts/compute_features.py --start ${{ github.event.inputs.start }} --end ${{ github.event.inputs.end || '' }}
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_features.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_features.py
          fi

      - name: Compute momentum scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python scripts/compute_momentum_score.py --start ${{ github.event.inputs.start }} --end ${{ github.event.inputs.end || '' }}
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_momentum_score.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_momentum_score.py
          fi

      - name: Compute financial stress scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_financial_stress_score.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_financial_stress_score.py
          fi

      - name: Compute management quality scores
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_management_quality_score.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_management_quality_score.py
          fi

      - name: Compute composite investMITRA score
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_investmitra_score.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_investmitra_score.py
          fi
      
      - name: Load scores to Neon
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          pip install duckdb --quiet
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/load_scores_to_neon.py --date ${{ github.event.inputs.date }}
          else
            python scripts/load_scores_to_neon.py
          fi

      - name: Compute early signals
        env:
          CC_ENV: prod
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/compute_early_signals.py --date ${{ github.event.inputs.date }}
          else
            python scripts/compute_early_signals.py
          fi
      
      - name: Fetch Screener signals
        run: pip install beautifulsoup4 --quiet && python scripts/fetch_screener_signals.py
    
      - name: Compute daily top picks
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
          TRADING_AGENTS_PATH: /home/runner/work/investMITRA/TradingAgents
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/daily_top_picks.py --date ${{ github.event.inputs.date }} --top 10 --cap ALL --no-ta
            python scripts/daily_top_picks.py --date ${{ github.event.inputs.date }} --top 10 --cap SMALLMICRO --no-ta
          else
            python scripts/daily_top_picks.py --top 10 --cap ALL --no-ta
            python scripts/daily_top_picks.py --top 10 --cap SMALLMICRO --no-ta
          fi
        
      - name: Fetch corporate events
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_corporate_events.py
      
      - name: Fetch Screener signals
        run: pip install beautifulsoup4 --quiet && python scripts/fetch_screener_signals.py

      - name: Fetch corporate events
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_corporate_events.py

      - name: Compute daily top picks
        env:
          CC_ENV: prod
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CC_BUCKET_RAW: cc-raw
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/daily_top_picks.py --date ${{ github.event.inputs.date }} --top 10 --cap ALL --no-ta
            python scripts/daily_top_picks.py --date ${{ github.event.inputs.date }} --top 10 --cap SMALLMICRO --no-ta
          else
            python scripts/daily_top_picks.py --top 10 --cap ALL --no-ta
            python scripts/daily_top_picks.py --top 10 --cap SMALLMICRO --no-ta
          fi
      
      - name: Fetch NSE announcements
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_nse_announcements.py

      - name: Fetch SEBI RSS
        env:
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
        run: python scripts/fetch_sebi_rss.py