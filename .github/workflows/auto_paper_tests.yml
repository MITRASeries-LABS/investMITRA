name: Automatic paper regression tests

on:
  pull_request:
    paths:
      - 'scripts/intraday_signals.py'
      - 'scripts/order_manager.py'
      - 'scripts/signal_runtime.py'
      - 'scripts/auto_paper_summary.py'
      - 'scripts/execution_capital.py'
      - 'test_capital_visibility.py'
      - 'intraday_signals.py'
      - 'test_auto_trading.py'
      - 'test_review_fixes.py'
      - '.github/workflows/auto_paper_tests.yml'
      - 'scripts/pipeline_date.py'
      - 'scripts/verify_pipeline_data.py'
      - 'scripts/load_prices_to_neon.py'
      - 'scripts/load_scores_to_neon.py'
      - 'scripts/compute_investmitra_score.py'
      - 'test_pipeline_dates.py'
      - 'test_overnight_readiness.py'
      - 'test_server_pipeline.py'
      - 'scripts/run_server_pipeline.py'
      - 'scripts/pipeline_heartbeat.py'
      - 'scripts/server_pipeline_failure.py'
      - 'deploy/systemd/**'
      - 'deploy/install_pipeline_server.sh'
      - 'requirements-pipeline-server.txt'
      - 'scripts/pipeline_readiness.py'
      - 'scripts/pipeline_readiness_report.py'
      - '.github/workflows/overnight_readiness.yml'
      - '.github/workflows/market_data.yml'
      - '.github/workflows/feature_engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install PyYAML
      - name: Validate server installer shell
        if: runner.os == 'Linux'
        run: bash -n deploy/install_pipeline_server.sh
      - name: Check syntax
        run: python -m py_compile scripts/intraday_signals.py scripts/order_manager.py scripts/execution_capital.py scripts/signal_runtime.py scripts/auto_paper_summary.py intraday_signals.py
      - name: Run offline lifecycle and review regressions
        run: python -m unittest -v test_auto_trading test_review_fixes test_capital_visibility test_pipeline_dates test_overnight_readiness test_server_pipeline
