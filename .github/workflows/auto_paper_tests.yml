name: Automatic paper regression tests

on:
  pull_request:
    paths:
      - 'scripts/intraday_signals.py'
      - 'scripts/order_manager.py'
      - 'scripts/signal_runtime.py'
      - 'scripts/auto_paper_summary.py'
      - 'intraday_signals.py'
      - 'test_auto_trading.py'
      - 'test_review_fixes.py'
      - '.github/workflows/auto_paper_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax
        run: python -m py_compile scripts/intraday_signals.py scripts/order_manager.py scripts/signal_runtime.py scripts/auto_paper_summary.py intraday_signals.py
      - name: Run offline lifecycle and review regressions
        run: python -m unittest -v test_auto_trading test_review_fixes
