name: Company Financials — BSE XBRL + NSE API

on:
  schedule:
    # Run daily at 10 PM IST (16:30 UTC) — picks up new quarterly filings
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily       # fetch new filings only
          - backfill    # full historical backfill

jobs:
  ingest-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-flow.txt arelle-release pdfplumber openpyxl

      - name: Run BSE XBRL ingestion
        env:
          CC_ENV: prod
          CC_DB_SCHEMA: investmitra
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          CC_TIMESCALE_URL: ${{ secrets.CC_TIMESCALE_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CC_BUCKET_RAW: cc-raw
          CC_BUCKET_QUARANTINE: cc-quarantine
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: python -m src.connectors.flows.ingest_bse_xbrl

      - name: Run NSE Financials API ingestion
        env:
          CC_ENV: prod
          CC_DB_SCHEMA: investmitra
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          CC_TIMESCALE_URL: ${{ secrets.CC_TIMESCALE_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CC_BUCKET_RAW: cc-raw
          CC_BUCKET_QUARANTINE: cc-quarantine
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.connectors.flows.ingest_nse_financials
