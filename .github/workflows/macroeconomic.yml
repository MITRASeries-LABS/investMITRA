name: Macroeconomic — RBI DBIE + MOSPI + FRED

on:
  schedule:
    # Run daily at 7 AM IST (01:30 UTC) — before market open
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  ingest-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-flow.txt fredapi openpyxl

      - name: Run RBI DBIE ingestion
        env:
          CC_ENV: prod
          CC_DB_SCHEMA: investmitra
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CC_BUCKET_RAW: cc-raw
          CC_BUCKET_QUARANTINE: cc-quarantine
          RBI_DBIE_API_KEY: ${{ secrets.RBI_DBIE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.connectors.flows.ingest_rbi_dbie

      - name: Run MOSPI ingestion
        env:
          CC_ENV: prod
          CC_DB_SCHEMA: investmitra
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CC_BUCKET_RAW: cc-raw
          CC_BUCKET_QUARANTINE: cc-quarantine
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.connectors.flows.ingest_mospi

      - name: Run FRED API ingestion
        env:
          CC_ENV: prod
          CC_DB_SCHEMA: investmitra
          CC_POSTGRES_URL: ${{ secrets.CC_POSTGRES_URL }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CC_BUCKET_RAW: cc-raw
          CC_BUCKET_QUARANTINE: cc-quarantine
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.connectors.flows.ingest_fred
